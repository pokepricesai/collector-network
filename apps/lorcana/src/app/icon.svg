<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>LorcanaPrices</title>
  <defs>
    <linearGradient id="lp-ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
  </defs>
  <!-- Four-point sparkle: elongated horizontal + vertical arms with
       narrower diagonals, echoing the Lorcana "Enchanted" starburst
       without copying any published mark. Solid amethyst gradient
       renders at 16px as a purple sparkle, at 180px as a jewel. -->
  <path
    fill="url(#lp-ink)"
    d="M32 4 L36 24 L44 22 L38 30 L60 32 L38 34 L44 42 L36 40 L32 60 L28 40 L20 42 L26 34 L4 32 L26 30 L20 22 L28 24 Z"
  />
  <!-- Bright core highlight — instantly reads as "ink drop reflecting
       light" even at favicon size. -->
  <circle cx="32" cy="32" r="4.5" fill="#FFF5E1" fill-opacity="0.92"/>
</svg>
